[project]
name = "presto-demo"
version = "0.1.0"
authors = [
    {name = "Intermodulation Products AB", email = "support@intermod.pro"},
]
description = "Demo scripts for the Presto platform runnable in loop-back"
license = "MIT"

requires-python = ">= 3.10"
dependencies = [
    "matplotlib >= 3.8",
    "numpy >= 1.25",
    "intermod-presto",
]


[dependency-groups]
dev = [
    "basedpyright>=1.39.0",
    "pyqt6 >= 6.11",  # otherwise matplotlib 3.8 doesn't work in uv
]

[tool.pyright]
typeCheckingMode = "standard"
deprecateTypingAliases = true
reportDeprecated = "warning"
reportMissingImports = false

[tool.ruff]
line-length = 100

[tool.uv]
config-settings-package = { intermod-presto = { editable_mode = "compat" } }

[tool.uv.sources]
intermod-presto = { path = "../presto-api", editable = true }
